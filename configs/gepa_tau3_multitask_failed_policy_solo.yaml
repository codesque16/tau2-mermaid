# Multitask GEPA on tasks that failed at least once in
# retail_solo_gemma4_26b_fp8_cloud_run_04_08_01_50_05 (see failed_at_least_once_task_ids.json).
#
# Seed = default solo retail policy (same family as assistant_solo runs), not mermaid.
#
# From repo root:
#   uv run python gepa/examples/tau3_gepa/main.py --config configs/gepa_tau3_multitask_failed_policy_solo.yaml --fresh
extends: configs/gepa_tau3_retail.yaml

gepa:
  optimization_mode: multi_task
  # Required so dataset_task_ids below are used (otherwise split_file_path wins).
  split_file_path: null

  seed_policy_path: tau3-bench-fork/data/tau2/domains/retail/policy_solo.md
  # Use non-mermaid reflection/template prompts to match the simple policy format.
  gepa_template_file: gepa/examples/tau2_retail_mermaid/seed_solo_v1_template.md
  reflection_prompts_file: gepa/examples/tau2_retail_mermaid/reflection_prompts_solo_v1.md

