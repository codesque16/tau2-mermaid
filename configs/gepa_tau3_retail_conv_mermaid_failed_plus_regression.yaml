# GEPA over τ³-bench-fork retail conversation runs, optimized on failed + regression tasks.
#
# Task set is derived from:
# tau3-bench-fork/data/simulations/retail_conv_openai_agent_mermaid_no_thinking_instructions_completions_04_17_12_19_03/task_pass_fail.json
#
# Composition:
# - All failed tasks (14)
# - + random regression sample of 20 from non-failed (seed=0)
# - Total dataset_task_ids: 34
#
# See details in:
# tau3-bench-fork/data/tau2/domains/retail/task_ids_conv_mermaid_failed_plus_regression_04_17_12_19_03.json
#
# Run from repo root:
#   uv run python gepa/examples/tau3_gepa/main.py --config configs/gepa_tau3_retail_conv_mermaid_failed_plus_regression.yaml --fresh

tau3:
  yaml_config: examples/retail_runs_final_completions_api.yaml
  run_id: retail_conv_openai_agent_mermaid_no_thinking_instructions_completions
  task_set_name: retail
  task_split_name: null
  merged_overrides: {}
  verbose_logs: false

gepa:
  seed_policy_path: tau3-bench-fork/data/tau2/domains/retail/policy_opus.md
  gepa_template_file: gepa/examples/tau3_gepa/seed_mermaid_conv_template.md
  output_dir: outputs/tau3_gepa_conv_mermaid_failed_plus_regression
  fresh: false
  run_dir: null

  optimization_mode: multi_task
  task_id: null
  dataset_task_ids: [4, 6, 13, 18, 19, 29, 32, 35, 36, 37, 38, 41, 43, 50, 54, 56, 58, 63, 64, 68, 69, 71, 72, 74, 82, 84, 88, 91, 98, 105, 107, 108, 110, 111]
  valset_task_ids: null

  evaluation_seed: 7789797979
  llm_seed_chain: true

  # Run each task N times; reward = successes / N. Diagnosis sees all trials in <trial> blocks.
  num_trials: 4

  reflection_llm_backend: genai
  reflection_lm: gemini-3.1-pro-preview
  reflection_genai_vertex_ai: true
  reflection_genai_temperature: 0.3
  reflection_genai_max_output_tokens: null
  reflection_genai_reasoning_effort: high

  diagnosis_llm_backend: genai
  diagnosis_lm: gemini-3.1-pro-preview
  diagnosis_genai_vertex_ai: true
  diagnosis_genai_temperature: 0.3
  diagnosis_genai_max_output_tokens: null
  diagnosis_genai_reasoning_effort: high

  reflection_prompts_file: gepa/examples/tau3_gepa/reflection_prompts_mermaid.md

  # Reflection minibatch
  reflection_minibatch_size: 15
  reflection_skip_perfect_score: false
  reflection_perfect_score: 1.0
  reflection_batch_sampler: vulnerable_min_errors
  min_errors_minibatch: 3
  min_errors_expand_step_size: 10
  vulnerable_minibatch_size: 4
  reflection_module_selector: round_robin

  evaluate_communication: true

  max_metric_calls: null
  max_candidate_proposals: 10
  max_workers: 180
  parallel: true
  raise_on_exception: true
  use_cloudpickle: false
  cache_evaluation: true
  cache_evaluation_storage: auto
  track_best_outputs: true
  candidate_selection_strategy: pareto
  frontier_type: hybrid
  val_evaluation_policy: full_eval
  best_example_evals_k: 30
  capture_traces: false
  capture_stdio: false
  display_progress_bar: true

  use_logfire: true
  use_wandb: false
  use_gcp_trace: false

  reflective_dataset_format: tau2_retail
