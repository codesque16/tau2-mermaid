# GEPA retail optimization (tau2-mermaid generalization, solo agent).
# Same as `generalization_gepa_retail_base_s2.yaml` but uses a Qwen **Vertex dedicated endpoint**
# for the main assistant (OpenAI-shaped `:predict` / `@requestFormat: chatCompletions`).

mode: solo
max_turns: 60
strict_dotenv_only: true

domain:
  name: retail
  policy:
    - "domains/retail/policy_base_solo.md"
  tasks: "domains/retail/tasks_solo_comms.json"
  evaluate_communication: true
  concurrency: 10
  instructions: "domains/retail/instructions.md"
  stop_mode: "first-text"
  task_ids: null
  trials: 1
  seed: 12345
  db_path: "domains/retail/db.json"

assistant:
  agent_type: gemini
  # Switch GemininAgent into dedicated Vertex endpoint mode.
  vertex_ai: true
  vertex_endpoint_id: "mg-endpoint-b9895d67-2e18-417d-ad70-a68e58f25dd9"
  vertex_project: "53845524870"
  vertex_location: "us-central1"
  vertex_http_predict_api_version: "v1"
  vertex_http_predict_base: "https://mg-endpoint-b9895d67-2e18-417d-ad70-a68e58f25dd9.us-central1-53845524870.prediction.vertexai.goog"

  # Defaults for the dedicated endpoint instance payload.
  # (Agent also injects `chat_template_kwargs: {enable_thinking: false}` unless you override.)
  vertex_endpoint_parameters:
    max_tokens: 2048
    temperature: 0
    top_p: 0.95
    chat_template_kwargs:
      enable_thinking: false

  # Label only (endpoint selects the actual deployed model).
  model: "qwen3-5-9b-vertex-endpoint-b9895d67"
  temperature: 0
  reasoning_effort: low
  mcp_tools_markdown_path: "gepa/examples/tau2_retail_mermaid/tools.md"
  mcps:
    - name: retail-tools
      type: stdio
      command: "uv run domains/retail/tools.py"
      tools:
        - "calculate"
        - "cancel_pending_order"
        - "exchange_delivered_order_items"
        - "find_user_id_by_name_zip"
        - "find_user_id_by_email"
        - "get_order_details"
        - "get_product_details"
        - "get_user_details"
        - "list_all_product_types"
        - "modify_pending_order_address"
        - "modify_pending_order_items"
        - "modify_pending_order_payment"
        - "modify_user_address"
        - "return_delivered_order_items"
        - "transfer_to_human_agents"

gepa:
  seed_policy_path: "gepa/examples/tau2_retail_mermaid/seed_solo_v1.md"
  gepa_template_file: "gepa/examples/tau2_retail_mermaid/seed_solo_v1_template.md"
  output_dir: "outputs/tau2_retail_mermaid"
  fresh: false
  run_dir: null

  optimization_mode: generalization
  task_id: null
  split_file_path: "configs/gepa_experiment1_autosplit_60_20_20.json"
  dataset_task_ids: null
  valset_task_ids: null

  evaluation_seed: 32452423
  llm_seed_chain: true

  # Reflection/diagnosis still use managed genai (not dedicated endpoints) in this repo.
  reflection_llm_backend: genai
  reflection_lm: "gemini-3.1-pro-preview"
  reflection_genai_vertex_ai: true
  reflection_genai_temperature: 0.3
  reflection_genai_max_output_tokens: null
  reflection_genai_reasoning_effort: high

  diagnosis_llm_backend: genai
  diagnosis_lm: "gemini-3.1-pro-preview"
  diagnosis_genai_vertex_ai: true
  diagnosis_genai_temperature: 0.3
  diagnosis_genai_max_output_tokens: null
  diagnosis_genai_reasoning_effort: high

  reflection_prompts_file: "gepa/examples/tau2_retail_mermaid/reflection_prompts_solo_v1.md"
  reflection_minibatch_size: 10
  reflection_skip_perfect_score: false
  reflection_perfect_score: null
  reflection_batch_sampler: epoch_shuffled
  reflection_module_selector: round_robin

  max_metric_calls: null
  max_candidate_proposals: 10
  max_workers: 10
  parallel: true
  raise_on_exception: true
  use_cloudpickle: false
  cache_evaluation: true
  cache_evaluation_storage: auto
  track_best_outputs: true
  candidate_selection_strategy: pareto
  frontier_type: hybrid
  val_evaluation_policy: full_eval
  best_example_evals_k: 30
  capture_traces: false
  capture_stdio: false
  display_progress_bar: true
  reflective_dataset_format: tau2_retail
  engine_seed: 0

  merge_enabled: false
  merge_max_invocations: 5
  merge_val_overlap_floor: 5

  use_wandb: false
  use_logfire: true
  dump_visualizer_events: false

