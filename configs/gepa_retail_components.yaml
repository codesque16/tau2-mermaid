# GEPA retail optimization — **multi-component** policy (tools + mermaid instructions + mermaid graph).
#
# Nomenclature (differs from ``gepa_retail_mermaid.yaml``):
#   gepa.fixed_retail_agent_rules_path — markdown prepended to every policy (NOT optimized by GEPA)
#   gepa.seed_components       — map each GEPA component name → seed markdown path (required)
#   gepa.gepa_merge_templates  — map each component → merge template with <gepa_generated> (required)
#
# Single-file seeds remain in ``tau2_retail_mermaid`` (``seed_policy_path`` + ``gepa_template_file``).
#
# Run from repo root:
#   uv run python gepa/examples/tau2_retail_components/main.py --config configs/gepa_retail_components.yaml

mode: solo
max_turns: 60
strict_dotenv_only: true

domain:
  name: retail
  policy:
    - "domains/retail/policy_base_solo.md"
  tasks: "domains/retail/tasks_solo_comms.json"
  evaluate_communication: true
  concurrency: 10
  instructions: "domains/retail/instructions.md"
  stop_mode: "first-text"
  task_ids: [2, 12, 17, 23, 27, 32, 33, 34, 45, 42, 43, 56, 66, 68, 78, 73, 86, 81, 91, 113, 102, 103]
  trials: 1
  seed: 34223423423
  db_path: "domains/retail/db.json"

assistant:
  agent_type: gemini
  model: gemini-3.1-flash-lite-preview
  vertex_ai: true
  temperature: 0
  reasoning_effort: low
  # Baseline path; each evaluation overrides with a temp file built from ``tools_markdown``.
  mcp_tools_markdown_path: "gepa/examples/tau2_retail_components/seeds/tools_markdown.md"
  mcps:
    - name: retail-tools
      type: stdio
      command: "uv run domains/retail/tools.py"
      tools:
        - "calculate"
        - "cancel_pending_order"
        - "exchange_delivered_order_items"
        - "find_user_id_by_name_zip"
        - "find_user_id_by_email"
        - "get_order_details"
        - "get_product_details"
        - "get_user_details"
        - "list_all_product_types"
        - "modify_pending_order_address"
        - "modify_pending_order_items"
        - "modify_pending_order_payment"
        - "modify_user_address"
        - "return_delivered_order_items"
        - "transfer_to_human_agents"

gepa:
  fixed_retail_agent_rules_path: "gepa/examples/tau2_retail_components/fixed/retail_agent_rules.md"

  seed_components:
    tools_markdown: "gepa/examples/tau2_retail_components/seeds/tools_markdown.md"
    mermaid_instructions: "gepa/examples/tau2_retail_components/seeds/mermaid_instructions.md"
    mermaid_graph: "gepa/examples/tau2_retail_components/seeds/mermaid_graph.md"
    # When ``tool_code_gate.enabled`` is true, add:
    # tool_code: "gepa/examples/tau2_retail_components/seeds/tool_code.md"

  gepa_merge_templates:
    tools_markdown: "gepa/examples/tau2_retail_components/merge_templates/tools_markdown.md"
    mermaid_instructions: "gepa/examples/tau2_retail_components/merge_templates/mermaid_instructions.md"
    mermaid_graph: "gepa/examples/tau2_retail_components/merge_templates/mermaid_graph.md"
    # When ``tool_code_gate.enabled`` is true, add:
    # tool_code: "gepa/examples/tau2_retail_components/merge_templates/tool_code.md"

  # When ``enabled`` is true, the run adds a ``tool_code`` GEPA component (seeds/merge above) and optional Monty gate; curator uses ``google.genai`` (defaults match ``diagnosis_*``).
  tool_code_gate:
    enabled: false
    max_rounds: 3
    use_monty: false
    curator_enabled: true
    curator_lm: null
    curator_temperature: null
    curator_genai_vertex_ai: null
    curator_genai_max_output_tokens: null
    curator_genai_reasoning_effort: null
    strict_fail_score: false

  # Used only when ``tool_code_gate.enabled`` is true (otherwise ignored).
  tool_code_persisted_markdown_path: "domains/retail/additional_tools.md"
  tool_code_append_to_persisted_file: false

  output_dir: "outputs/tau2_retail_components"
  fresh: false
  run_dir: null

  optimization_mode: multi_task
  task_id: null
  dataset_task_ids: [2, 12, 17]
  valset_task_ids: null

  evaluation_seed: 7789797979
  llm_seed_chain: true

  reflection_llm_backend: genai
  reflection_lm: "gemini-3.1-pro-preview"
  reflection_genai_vertex_ai: true
  reflection_genai_temperature: 0.3
  reflection_genai_max_output_tokens: null
  reflection_genai_reasoning_effort: high

  diagnosis_llm_backend: genai
  diagnosis_lm: "gemini-3.1-pro-preview"
  diagnosis_genai_vertex_ai: true
  diagnosis_genai_temperature: 0.3
  diagnosis_genai_max_output_tokens: null
  diagnosis_genai_reasoning_effort: high

  reflection_prompts_file: "gepa/examples/tau2_retail_components/reflection_prompts_components.md"

  reflection_minibatch_size: 10
  reflection_skip_perfect_score: false
  reflection_perfect_score: null
  reflection_batch_sampler: epoch_shuffled
  reflection_module_selector: round_robin

  # One full val pass alone needs len(valset) calls (e.g. 22–23). ``20`` exhausts before any reflection.
  # Use ``null`` for no cap (like ``generalization_gepa_retail_base_s2.yaml``); set a small integer only for smoke tests.
  max_metric_calls: null
  max_candidate_proposals: 10
  max_workers: 10
  parallel: true
  raise_on_exception: true
  use_cloudpickle: false
  cache_evaluation: true
  cache_evaluation_storage: auto
  track_best_outputs: true
  candidate_selection_strategy: pareto
  frontier_type: hybrid
  val_evaluation_policy: full_eval
  best_example_evals_k: 30
  capture_traces: false
  capture_stdio: false
  display_progress_bar: true
  reflective_dataset_format: tau2_retail
  engine_seed: 0

  merge_enabled: false
  merge_max_invocations: 5
  merge_val_overlap_floor: 5

  use_wandb: false
  use_logfire: true
  dump_visualizer_events: false
