# Solo batch evaluation: same task JSON / task_ids / DB eval as conversational batch,
# but single-agent simulation (no user simulator). Policy = adapted original for solo (``seed_solo_v1.md``).
#
#   uv run python -m domains.retail.run_solo_tasks --config configs/gemini_solo_batch.yaml
#
# Omit ``domain.task_ids`` to run all ``solo_convertible`` tasks in ``tasks_solo_comms.json``.

mode: solo
max_turns: 60
strict_dotenv_only: true

domain:
  name: retail
  policy: gepa/examples/tau2_retail_mermaid/seed_solo_v1.md
  tasks: domains/retail/tasks_solo_comms.json
  output_task_transcripts: true
  output_base_dir: "outputs"
  evaluate_communication: true
  concurrency: 20
  instructions: domains/retail/instructions.md
  # When the assistant emits non-tool text (see ``run_solo_tasks`` for other stop modes).
  stop_mode: "first-text"
  # Omit ``task_ids`` to run all ``solo_convertible`` tasks in ``tasks_solo_comms.json``.
  trials: 1
  seed: 34223423423

assistant:
  agent_type: gemini
  vertex_ai: true
  model: "gemini-3.1-flash-lite-preview"
  temperature: 0
  reasoning_effort: ["low", "medium", "high"]
  mcp_tools_markdown_path: "gepa/examples/tau2_retail_mermaid/tools.md"
  mcps:
    - name: retail-tools
      type: stdio
      command: "uv run domains/retail/tools.py"
      tools:
        - "calculate"
        - "cancel_pending_order"
        - "exchange_delivered_order_items"
        - "find_user_id_by_name_zip"
        - "find_user_id_by_email"
        - "get_order_details"
        - "get_product_details"
        - "get_user_details"
        - "list_all_product_types"
        - "modify_pending_order_address"
        - "modify_pending_order_items"
        - "modify_pending_order_payment"
        - "modify_user_address"
        - "return_delivered_order_items"
        - "transfer_to_human_agents"
