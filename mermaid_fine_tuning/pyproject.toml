[project]
name = "mermaid-fine-tuning"
version = "0.1.0"
description = "Fine-tuning pipeline for Gemma 4 SOP-agent on 4xA100"
# Pin to Python 3.12 specifically. PyTorch CUDA wheels stop at cp313 and
# the broader HF training stack (flash-attn, bitsandbytes, accelerate) is
# most-tested on 3.12. Python 3.14 and newer will not work yet.
requires-python = ">=3.11,<3.13"

# ============================================================
# This is the TRAINING machine config. Data generation runs
# elsewhere (on the tau2-mermaid Mac); the JSONL files arrive
# here as inputs. We only need training, eval, and the
# infrastructure to load + format the data files.
# ============================================================

dependencies = [
    # Project config / schema (used by manifest.py, schemas.py, etc.)
    "pydantic>=2.7",
    "pyyaml>=6.0",

    # Console output for training/eval
    "rich>=13.7",

    # Core PyTorch + HF stack
    "torch>=2.4,<2.6",
    "transformers>=4.50",
    "accelerate>=0.34",
    "peft>=0.12",
    "trl>=0.11",
    "datasets>=2.21",

    # Quantization (QLoRA, 4-bit eval)
    "bitsandbytes>=0.43",

    # Flash Attention 2 — required by the FSDP / large-context configs.
    # If install fails on your CUDA version, comment this out and the
    # manifests will fall back to SDPA.
    "flash-attn>=2.6.0",

    # Tokenizer dependencies pulled in by transformers, made explicit:
    "sentencepiece>=0.2",
    "protobuf>=4.25",

    # OpenAI-compatible API (vLLM / TGI / local servers)
    "openai>=1.40",
]

# ============================================================
# Build configuration
# ============================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "data_gen", "evaluation", "training", "utils"]

# ============================================================
# uv configuration
# ============================================================

[tool.uv]
# Don't try to compile flash-attn from source if a binary wheel isn't found;
# this is the common pitfall on first-time setup. Comment out flash-attn
# above if you hit issues, and rely on SDPA attention instead.
no-build-isolation-package = ["flash-attn"]

# CUDA 12.4 PyTorch wheels (forward-compatible with your CUDA 13 driver).
# If your driver is CUDA 12.x, this still works.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }