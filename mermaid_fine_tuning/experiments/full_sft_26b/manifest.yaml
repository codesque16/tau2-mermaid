name: full_sft_26b
description: |
  Full-parameter SFT on Gemma 4 26B across 4x A100 40GB using FSDP.
  Direct comparison to qlora_26b_pilot at matched data and matched epochs to
  answer "does full SFT lift over LoRA at this data scale?" — Track 3 question 2.
  Expect 6-8x slower per step than QLoRA but ~3x stronger learning per epoch.

mode: full_sft

data:
  train_path: data/batch1/train.jsonl
  eval_path: data/batch1/eval_formatted.jsonl
  graphs_path: data/batch1/graphs.jsonl

model:
  name: google/gemma-4-26b-a4b-it
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2

full_sft:
  activation_checkpointing: true

training:
  num_train_epochs: 3
  # Per-device batch is small because activations dominate memory at 8k context.
  # Effective batch = 1 * 4 GPUs * 8 accum = 32 (vs 16 for QLoRA — close enough).
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  # Full SFT wants a lower LR than LoRA: ~10x smaller is a safe default.
  learning_rate: 1.0e-5
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_seq_length: 8192
  gradient_checkpointing: true
  optim: adamw_torch
  bf16: true
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  save_total_limit: 2
  seed: 42

eval_spec:
  run_eval: true
  # Full-precision eval after full SFT is fairer; 4-bit eval would mask gains.
  quantize_for_eval: false
