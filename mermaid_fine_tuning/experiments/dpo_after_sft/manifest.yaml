name: dpo_after_sft
description: |
  DPO on top of the QLoRA 26B SFT checkpoint, using preference pairs
  generated from hard-negative trajectory turns (e.g., correct trace +
  correct response vs. trace says X but response does Y).
  Track 3 question 3 / "RL-ish" step: does DPO further sharpen behaviors
  that SFT-on-positives can't?

  Run AFTER qlora_26b_pilot has produced its final checkpoint.

mode: dpo

data:
  train_path: data/batch1/train.jsonl       # not used for DPO; kept for compatibility
  eval_path: data/batch1/eval_formatted.jsonl
  graphs_path: data/batch1/graphs.jsonl

model:
  name: google/gemma-4-26b-a4b-it
  torch_dtype: bfloat16

dpo:
  beta: 0.1
  # You produce this file separately, from hard-negative pairs (see
  # data_gen/build_dpo_pairs.py — to be added in the next step of Track 3).
  preference_data_path: data/batch1/dpo_pairs.jsonl
  # Continue from the SFT checkpoint:
  sft_checkpoint: experiments/qlora_26b_pilot/checkpoints/final

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  # DPO LR is much lower than SFT; over-conservative beats over-fit.
  learning_rate: 5.0e-7
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_seq_length: 8192
  bf16: true
  logging_steps: 5
  save_steps: 50

eval_spec:
  run_eval: true
  quantize_for_eval: true
