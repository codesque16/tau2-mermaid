name: qlora_e4b_pilot
description: |
  QLoRA on Gemma 4 E4B for fast iteration. Useful to compare against 26B at
  matched data: does the bigger model's extra capacity actually help on this
  task at small data scale? Single A100 40GB; fits comfortably and trains
  ~4x faster than the 26B.

mode: qlora

data:
  train_path: data/batch1/train.jsonl
  eval_path: data/batch1/eval_formatted.jsonl
  graphs_path: data/batch1/graphs.jsonl

model:
  name: google/gemma-4-e4b-it
  torch_dtype: bfloat16
  # Gemma 4 uses alternating local/global attention with different head
  # dimensions; the global heads exceed FlashAttention 2's max of 256.
  # SDPA (PyTorch native) has no such limit. It's ~20-30% slower per step
  # but works correctly. Once flash-attn 3 lands with larger head dim
  # support, this can switch back to "flash_attention_2".
  attn_implementation: sdpa

qlora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  # bs=2 with 8k context OOMs on a single A100 40GB even with SDPA + grad
  # checkpointing because the activation memory peaks during the SDPA matmul.
  # bs=1 leaves headroom; we double grad_accumulation_steps to keep the
  # effective batch size at 16 (same as before).
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_seq_length: 8192
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  save_total_limit: 2
  seed: 42
  # In-loop eval OOMs at 8k context with E4B because eval allocates the
  # full logits tensor. Skip it; eval_harness.py runs after training and
  # gives us the real per-skill metrics anyway.
  skip_in_loop_eval: true

eval_spec:
  run_eval: true
  quantize_for_eval: true