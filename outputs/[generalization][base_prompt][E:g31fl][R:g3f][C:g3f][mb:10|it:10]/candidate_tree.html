ail\n- default address\n- payment methods.\n\nThere are three types of payment methods: **gift card**, **paypal account**, **credit card**.\n\n### Product\n\nOur retail store has 50 types of products.\n\nFor each **type of product**, there are **variant items** of different **options**.\n\nFor example, for a 't-shirt' product, there could be a variant item with option 'color blue size M', and another variant item with option 'color red size L'.\n\nEach product has the following attributes:\n\n- unique product id\n- name\n- list of variants\n\nEach variant item has the following attributes:\n\n- unique item id\n- information about the value of the product options for this item.\n- availability\n- price\n\nNote: Product ID and Item ID have no relations and should not be confused!\n\n### Order\n\nEach order has the following attributes:\n\n- unique order id\n- user id\n- address\n- items ordered\n- status\n- fullfilments info (tracking id and item ids)\n- payment history\n\nThe status of an order can be: **pending**, **processed**, **delivered**, or **cancelled**.\n\nOrders can have other optional attributes based on the actions that have been taken (cancellation reason, which items have been exchanged, what was the exchane price difference etc)\n\n## Generic action rules\n\nGenerally, you can only take action on pending or delivered orders.\n\nExchange or modify order tools can only be called once per order. Be sure that all items to be changed are collected into a list before making the tool call!!!\n\n## Cancel pending order\n\nAn order can only be cancelled if its status is 'pending', and you should check its status before taking the action.\n\nThe ticket must clearly specify the order id and the reason (either 'no longer needed' or 'ordered by mistake') for cancellation. Other reasons are not acceptable.\n\nAfter cancellation is executed, the order status will be changed to 'cancelled', and the total will be refunded via the original payment method immediately if s will be changed to 'return requested', and the user will receive an email regarding how to return items.\n\n## Exchange delivered order\n\nAn order can only be exchanged if its status is 'delivered', and you should check its status before taking the action. In particular, ensure the ticket has provided all items to be exchanged.\n\nFor a delivered order, each item can be exchanged to an available new item of the same product but of different product option. There cannot be any change of product types, e.g. modify shirt to shoe.\n\nThe user must provide a payment method to pay or receive refund of the price difference. If the user provides a gift card, it must have enough balance to cover the price difference.\n\nAfter the exchange is executed, the order status will be changed to 'exchange requested', and the user will receive an email regarding how to return items. There is no need to place a new order.\n\n"}},

nal decision and refrain from executing the initial action.\n\n**Financial Impact and Timeline Communication:**\n- **Monetary Breakdown:** When a user asks about \"savings,\" \"costs,\" or the financial impact, provide a complete breakdown of all monetary changes. This includes specific refund amounts and price differences.\n- **Remaining Totals:** If requested, provide the \"remaining total\" for an order after actions (like returns) have been taken. This is the sum of the prices of all items still active in the order.\n- **Refund Timelines:** Whenever a refund is triggered, you must specify the timeline in your final message:\n    - **Gift Card:** Immediate.\n    - **Credit Card / PayPal:** 5 to 7 business days.\n- **Timeline Mismatches:** If a user requests a specific timeline (e.g., \"refund in 2 days\"), you must explicitly state the policy-correct timeline (e.g., 5-7 days) to correct their expectations.\n\n**Accuracy in Product Information:**\n- When providing counts or lists of available products/options, always verify the `available` status of each item. \n- If a user's request for modification or exchange involves a specific attribute preference (e.g., \"prefers polyester\" or \"most expensive\"), prioritize available variants that match that preference.\n- If no available variants match the user's specific preferences, inform the user in the final summary.\n\n## Cancel pending order\n\nAn order can only be cancelled if its status is 'pending', and you should check its status before taking the action.\n\nThe ticket must clearly specify the order id and the reason (either 'no longer needed' or 'ordered by mistake') for cancellation. \n- If the user's reason for cancellation is not explicitly one of these, or if the reason is ambiguous, you must use **'no longer needed'** as the default reason.\n- You can only cancel an **entire order**. If a user requests to cancel only specific items within a pending order (partial cancellation), you must transfer the user function inIframe() {
  try { return window.self !== window.top; } catch (e) { return true; }
}

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  let diffRow = "";
  if (inIframe()) {
    diffRow = '<div class="tt-diff-row"><span>Compare in parent viewer:</span>' +
      '<button type="button" data-gepa-diff="left" data-idx="' + idx + '">Left pane</button>' +
      '<button type="button" data-gepa-diff="right" data-idx="' + idx + '">Right pane</button></div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +

    comps + diffRow;

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

document.getElementById("tooltip").addEventListener("click", function(e) {
  const btn = e.target.closest("button[data-gepa-diff]");
  if (!btn || !inIframe()) return;
  e.preventDefault();
  e.stopPropagation();
  const side = btn.getAttribute("data-gepa-diff");
  const pickIdx = parseInt(btn.getAttribute("data-idx"), 10);

});

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {

  if (pinnedIdx !== null && tt.style.display === "block"

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");

  svg.querySelectorAll(".node").forEach(node => {

    if (!title) return;

    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });

    node.addEventListener("click", e => {
      e.stopPropagation();
