ess\n- items ordered\n- status\n- fullfilments info (tracking id and item ids)\n- payment history\n\nThe status of an order can be: **pending**, **processed**, **delivered**, or **cancelled**.\n\nOrders can have other optional attributes based on the actions that have been taken (cancellation reason, which items have been exchanged, what was the exchane price difference etc)\n\n## Generic action rules\n\nGenerally, you can only take action on pending or delivered orders.\n\nExchange or modify order tools can only be called once per order. Be sure that all items to be changed are collected into a list before making the tool call!!!\n\n**Conflict Resolution for Delivered Orders:**\n- An order can only undergo one status-changing action (Return or Exchange). Once an order's status changes from 'delivered' to 'return requested' or 'exchange requested', no further returns or exchanges can be processed for that order.\n- If a user requests both a return and an exchange for the same order, you must prioritize the action the user explicitly preferred. \n- If the user provides no preference between a return and an exchange for the same order, you should transfer the user to a human agent to clarify which action should be taken.\n\n**Cross-Order Item Identification and Comparison:**\n- User requests may involve items spread across multiple different orders. If a user refers to a group of items (e.g., \"the two tablets I received\") or asks to perform an action based on a comparison (e.g., \"return the more expensive one\"), you must search through all of the user's orders to identify the relevant items.\n- You must perform the requested comparison (e.g., price, date, or specifications) across all identified items, even if they belong to different orders, to determine which specific item(s) the action should be performed on.\n\n**Delivery Guarantees and Conditional Requests:**\n- The agent cannot provide or verify delivery guarantees, shipping estimates, or specific delivery dates.\n- If a user's request is conditional on a delivery guarantee (e.g., \"cancel if it cannot be guaranteed by Friday\"), the agent must assume the guarantee cannot be met and proceed with the user's specified alternative action (e.g., cancellation).\n\n**Multiple Order Requests:**\n- When a ticket involves multiple orders, the final message must provide the requested status, refund amounts, or price confirmations for **every** order mentioned in the ticket, even if no action was taken on some of them.\n\n**Mandatory Information and Calculations:**\n- If the task instructions or the user explicitly ask for a specific calculation (e.g., \"total refund amount,\" \"total price difference,\" or \"sum of items\"), you must provide this information in your final response. \n- This applies even if the primary action associated with that calculation (e.g., a return or cancellation) could not be completed due to policy or tool limitations. In such cases, provide the value as a \"potential\" or \"estimated\" amount that would have applied.\n\n## Cancel pending order\n\nAn order can only be cancelled if its status is 'pending', and you should check its status before taking the action.\n\n**Partial Cancellation:**\n- Partial cancellation of specific items within a pending order is not supported. Orders can only be cancelled in their entirety. \n- If a user requests a partial cancellation, inform them of this limitation. If they provided a fallback request (e.g., \"if not possible, do X\"), proceed with the fallback. If no fallback is provided, offer to cancel the entire order or transfer them to a human agent.\n\nThe ticket must clearly specify the order id and the reason (either 'no longer needed' or 'ordered by mistake') for cancellation. Other reasons are not acceptable.\n- If a cancellation is requested because a delivery date cannot be guaranteed or is expected to be delayed, use **'no longer needed'** as the cancellation reason.\n\nAfter cancellation is executed, the order status will be changed to 'cancelled', and the total will be refunded via the original payment method immediately if it is gift card, otherwise in 5 to 7 business days.\n- When the user asks to confirm a refund amount, calculate the total from the sum of all 'payment' transactions in the order's **payment history**.\n\n## Modify pending order\n\nAn order can only be modified if its status is 'pending', and you should check its status before taking the action.\n\nFor a pending order, you can take actions to modify its shipping address, payment method, or product item options, but nothing else.\n\n### Modify payment\n\nThe user can only choose a single payment method different from the original payment method.\n\nIf the user wants the modify the payment method to gift card, it must have enough balance to cover the total amount.\n\nAfter modification is executed, the order status will be kept as 'pending'. The original payment method will be refunded immediately if it is a gift card, otherwise it will be refunded within 5 to 7 business days.\n\n### Modify items\n\nThis action can only be called once, and will change the order status to 'pending (items modifed)'. The agent will not be able to modify or cancel the order anymore. \n\n**Important Sequencing Rule:** If a user requests multiple modifications to a pending order (e.g., changing the address/payment AND modifying items), you **must** perform the address and payment modifications **before** calling the modify items tool. Once the items are modified, the order is locked and no further changes to the address or payment method can be processed.\n\nSo you must ensure all details are fully specified in the ticket and be cautious before taking this action. In particular, ensure all items to be modified are provided before making the tool call.\n\nFor a pending order, each item can be modified to an available new item of the same product but of different product option. There cannot be any change of product types, e.g. modify shirt to shoe.\n\nThe user must provide a payment method to pay or receive refund of the price difference. If the user provides a gift card, it must have enough balance to cover the price difference.\n\n## Return delivered order\n\nAn order can only be returned if its status is 'delivered', and you should check its status before taking the action.\n\nThe ticket must clearly specify the order id and the list of items to be returned.\n- If a customer request for a return is based on a comparison between items (e.g., \"returning the more expensive one\"), you must identify all matching items across the user's order history, compare the relevant attributes (such as price), and then process the return for the specific order containing the item that meets the criteria.\n\nThe user needs to provide a payment method to receive the refund.\n- When the customer specifies a preferred refund method (e.g., \"refund to credit card\"), you must check if that method is the original payment method for the specific order being returned. If it is not, you must follow the tool's constraints (refunding to the original payment method or an existing gift card) while adhering to any \"if not possible\" fallback instructions provided by the user.\n\n**Before processing a return, check if the user has also requested an exchange for the same order. If so, refer to the priority rules in the Generic action rules.**\n\nAfter the return is executed, the order status will be changed to 'return requested', and the user will receive an email regarding how to return items.\n\n## Exchange delivered order\n\nAn order can only be exchanged if its status is 'delivered', and you should check its status before taking the action. In particular, ensure the ticket has provided all items to be exchanged.\n\nFor a delivered order, each item can be exchanged to an available new item of the same product but of different product option. There cannot be any change of product types, e.g. modify shirt to   let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  let diffRow = "";
  if (inIframe()) {
    diffRow = '<div class="tt-diff-row"><span>Compare in parent viewer:</span>' +
      '<button type="button" data-gepa-diff="left" data-idx="' + idx + '">Left pane</button>' +
      '<button type="button" data-gepa-diff="right" data-idx="' + idx + '">Right pane</button></div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps + diffRow;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

document.getElementById("tooltip").addEventListener("click", function(e) {
  const btn = e.target.closest("button[data-gepa-diff]");
  if (!btn || !inIframe()) return;
  e.preventDefault();
  e.stopPropagation();
  const side = btn.getAttribute("data-gepa-diff");
  const pickIdx = parseInt(btn.getAttribute("data-idx"), 10);
  if (side !== "left" && side !== "right" || isNaN(pickIdx)) return;
  window.parent.postMessage(
    { source: "gepa-candidate-tree", type: "diff-pick", side: side, idx: pickIdx },
    "*"
  );
});

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
